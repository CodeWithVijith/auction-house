services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auction_house
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - auction-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auction -d auction_house']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auction-postgres:
